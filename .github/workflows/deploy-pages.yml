name: Deploy Watchlist to GitHub Pages

on:
  push:
    branches:
      - claude/help-coding-task-4a4aj

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: watchlist-app
        run: npm ci

      - name: Build
        working-directory: watchlist-app
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./watchlist-app/dist
